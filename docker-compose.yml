version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: POSTGRES_DB_MINI_ECOMMERCE
    restart: always
    ports:
      - '5444:5432'
    environment:
      POSTGRES_DB: { DB_NAME }
      POSTGRES_USER: { DB_USER }
      POSTGRES_PASSWORD: { DB_PASSWORD }
    volumes:
      - D:/docker/productsApidb:/var/lib/postgresql/data
