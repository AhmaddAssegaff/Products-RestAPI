version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: POSTGRES_DB_MINI_ECOMMERCE
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - D:/docker/mini_ecommarce_db:/var/lib/postgresql/data
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: NESTJS_MINI_ECOMMERCE
    depends_on:
      - postgres
    environment:
      - NODE_ENV=${NODE_ENV}
      - APP_PORT=${APP_PORT}
      - API_PREFIX=${API_PREFIX}
      - ENABLE_VERSION=${ENABLE_VERSION}
      - VERSION_PREFIX=${VERSION_PREFIX}
      - DEFAULT_VERSION=${DEFAULT_VERSION}
      - SW_USERNAME=${SW_USERNAME}
      - SW_PASSWORD=${SW_PASSWORD}
      - SW_PATH=${SW_PATH}
      - TZ=${TZ}
      - AUTH_JWT_ACCESS_TOKEN_SECRET=${AUTH_JWT_ACCESS_TOKEN_SECRET}
      - AUTH_JWT_ACCESS_TOKEN_EXPIRES_IN=${AUTH_JWT_ACCESS_TOKEN_EXPIRES_IN}
      - AUTH_JWT_REFRESH_TOKEN_SECRET=${AUTH_JWT_REFRESH_TOKEN_SECRET}
      - AUTH_JWT_REFRESH_TOKEN_EXPIRES_IN=${AUTH_JWT_REFRESH_TOKEN_EXPIRES_IN}
      - AUTH_JWT_PAYLOAD_ENCRYPT=${AUTH_JWT_PAYLOAD_ENCRYPT}
      - AUTH_JWT_ENCRYPTION_KEY=${AUTH_JWT_ENCRYPTION_KEY}
      - AUTH_JWT_ENCRYPTION_IV=${AUTH_JWT_ENCRYPTION_IV}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    ports:
      - '${APP_PORT}:3000'
    networks:
      - backend

  prometheus:
    image: prom/prometheus
    container_name: PROMETHEUS_MINI_ECOMMERCE
    restart: always
    ports:
      - '${PROMETHEUS_PORT}:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend

  grafana:
    image: grafana/grafana
    container_name: GRAFANA_MINI_ECOMMERCE
    restart: always
    ports:
      - '${GRAFANA_PORT}:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - D:/docker/mini_ecommarce_grafana:/var/lib/grafana
    networks:
      - backend
  loki:
    image: grafana/loki:latest
    container_name: LOKI_MINI_ECOMMERCE
    restart: always
    ports:
      - '${LOKI_PORT}:3100'
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend

  promtail:
    image: grafana/promtail:latest
    container_name: PROMTAIL_MINI_ECOMMERCE
    restart: always
    volumes:
      - ./logs:/var/log/myapp
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend

networks:
  backend:
    driver: bridge
